# Typecheck, test, build and pack the package on its own, the way someone who
# clones this repository would: npm on each supported Node line, and Bun.
# `@wuapidev/sdk` comes from npm here (in the monorepo it is the workspace copy).
#
# This repository mirrors packages/wuapi-cli of the wuapi monorepo (see
# CONTRIBUTING.md); the same checks run there before anything lands here.
# src/generated/operations.ts is generated there from the API spec and
# committed; here it is used as is.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Maintained Node lines. The package runs on Node 20+ (engines in
        # package.json).
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Update npm
        run: npm install --global npm@11 --no-audit --no-fund
      # The monorepo sync pushes every mirror at the same moment, so a change
      # that bumps the SDK together with this package gets here before the new
      # SDK is on npm, and `npm install` would fail with ETARGET. Wait for it.
      - name: Wait for the @wuapidev/sdk version this package needs
        run: |
          range="$(node -p "require('./package.json').dependencies['@wuapidev/sdk']")"
          for attempt in $(seq 1 60); do
            # The registry lists a new version a few minutes before its tarball can
            # be downloaded (0.10.0: about five minutes, 0.11.0: more than ten), and `npm install` then fails with
            # E404. So download it, rather than only asking whether it is listed.
            if npm pack "@wuapidev/sdk@${range}" --pack-destination "$RUNNER_TEMP" > /dev/null 2>&1; then
              echo "@wuapidev/sdk@${range} is on npm and its tarball downloads."
              exit 0
            fi
            echo "@wuapidev/sdk@${range} cannot be downloaded from npm yet (attempt ${attempt} of 60). Waiting 30 seconds."
            sleep 30
          done
          echo "::error::@wuapidev/sdk@${range} could not be downloaded from npm within 30 minutes. Check the Release workflow of wuapidev/wuapi-typescript, then re-run this one."
          exit 1

      - name: Install
        run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack (dry run)
        run: npm pack --dry-run
      - name: The binary starts, and refuses to call the API without a key
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null
          node dist/cli.js messages send --help > /dev/null
          if XDG_CONFIG_HOME="$(mktemp -d)" WUAPI_API_KEY='' node dist/cli.js whoami --json; then echo "::error::ran without a key"; exit 1; fi

  bun:
    name: Bun
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The monorepo sync pushes every mirror at the same moment, so a change
      # that bumps the SDK together with this package gets here before the new
      # SDK is on npm, and `npm install` would fail with ETARGET. Wait for it.
      - name: Wait for the @wuapidev/sdk version this package needs
        run: |
          range="$(node -p "require('./package.json').dependencies['@wuapidev/sdk']")"
          for attempt in $(seq 1 60); do
            # The registry lists a new version a few minutes before its tarball can
            # be downloaded (0.10.0: about five minutes, 0.11.0: more than ten), and `npm install` then fails with
            # E404. So download it, rather than only asking whether it is listed.
            if npm pack "@wuapidev/sdk@${range}" --pack-destination "$RUNNER_TEMP" > /dev/null 2>&1; then
              echo "@wuapidev/sdk@${range} is on npm and its tarball downloads."
              exit 0
            fi
            echo "@wuapidev/sdk@${range} cannot be downloaded from npm yet (attempt ${attempt} of 60). Waiting 30 seconds."
            sleep 30
          done
          echo "::error::@wuapidev/sdk@${range} could not be downloaded from npm within 30 minutes. Check the Release workflow of wuapidev/wuapi-typescript, then re-run this one."
          exit 1

      - name: Install
        run: bun install --no-save
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
