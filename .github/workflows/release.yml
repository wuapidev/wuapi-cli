# Publishes `wuapi` (the CLI) to npm when main has a version npm does not have yet.
#
# - Pushes to main (the monorepo sync pushes here): typecheck, test and build,
#   then `npm publish --provenance` unless npm already has package.json's
#   version, so re-runs and syncs that do not bump the version publish nothing.
#   A version with a pre-release part (0.2.0-beta.1) goes to the `next`
#   dist-tag, any other to `latest`. Then it creates the `v<version>` tag and a
#   GitHub Release with generated notes (skipped when the release exists).
# - workflow_dispatch: the same job by hand, a dry run by default.
#
# Auth is npm trusted publishing (OIDC), with no token: npm must list this
# repository and this workflow file as the package's trusted publisher.
# Setup: RELEASING.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, test and `npm publish --dry-run` only. Nothing is published, tagged or released.
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, never cancelled halfway through a publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    # Never from a fork or a copy of this repository.
    if: github.repository == 'wuapidev/wuapi-cli'
    runs-on: ubuntu-latest
    # Up to 10 of these minutes are the wait for the SDK on npm.
    timeout-minutes: 45
    permissions:
      contents: write # the v<version> tag and the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    steps:
      - name: Refuse to publish from a ref other than main
        if: github.ref != 'refs/heads/main' && env.DRY_RUN != 'true'
        run: |
          echo "::error::Publishing runs from main only (this run is on ${GITHUB_REF}). Re-run on main, or tick dry-run."
          exit 1

      - uses: actions/checkout@v5
        with:
          # Tags, to start the release notes at the previous v<version> tag.
          fetch-depth: 0

      # Trusted publishing needs Node 22.14 or later and npm 11.5.1 or later.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update npm
        run: npm install --global npm@^11.5.1 && npm --version

      # The monorepo sync pushes every mirror at the same moment, so a change
      # that bumps the SDK together with this package gets here before the new
      # SDK is on npm, and `npm install` would fail with ETARGET. Wait for it.
      - name: Wait for the @wuapidev/sdk version this package needs
        run: |
          range="$(node -p "require('./package.json').dependencies['@wuapidev/sdk']")"
          for attempt in $(seq 1 60); do
            # The registry lists a new version a few minutes before its tarball can
            # be downloaded (0.10.0: about five minutes, 0.11.0: more than ten), and `npm install` then fails with
            # E404. So download it, rather than only asking whether it is listed.
            if npm pack "@wuapidev/sdk@${range}" --pack-destination "$RUNNER_TEMP" > /dev/null 2>&1; then
              echo "@wuapidev/sdk@${range} is on npm and its tarball downloads."
              exit 0
            fi
            echo "@wuapidev/sdk@${range} cannot be downloaded from npm yet (attempt ${attempt} of 60). Waiting 30 seconds."
            sleep 30
          done
          echo "::error::@wuapidev/sdk@${range} could not be downloaded from npm within 30 minutes. Check the Release workflow of wuapidev/wuapi-typescript, then re-run this one."
          exit 1

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Plan
        id: plan
        run: node scripts/release.mjs plan | tee -a "$GITHUB_OUTPUT"

      - name: Typecheck, test, build
        run: npm run typecheck && npm test && npm run build

      - name: Publish ${{ steps.plan.outputs.name }}@${{ steps.plan.outputs.version }} (${{ steps.plan.outputs.dist_tag }})
        if: steps.plan.outputs.published == 'false'
        env:
          DIST_TAG: ${{ steps.plan.outputs.dist_tag }}
        # npm exchanges this job's OIDC token (id-token: write) for a
        # short-lived publish token and signs a provenance statement that ties
        # the tarball to this commit and workflow run. `npm publish` runs the
        # package's prepublishOnly (typecheck, test, build) again before packing.
        run: |
          args=(--access public --tag "$DIST_TAG")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(--provenance)
          fi
          npm publish "${args[@]}"

      - name: Already on npm
        if: steps.plan.outputs.published == 'true'
        run: echo "::notice::${{ steps.plan.outputs.name }}@${{ steps.plan.outputs.version }} is already on npm; nothing to publish."

      - name: Tag and GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; nothing to do."
            exit 0
          fi
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
          if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
